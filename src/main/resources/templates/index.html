index.html
Thymeleaf画面
========================== -->

<!DOCTYPE html>

<!-- Thymeleaf利用宣言 -->
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- 文字コード -->
    <meta charset="UTF-8">

    <!-- タイトル -->
    <title>Travel Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

    <!-- 見出し -->
    <h1>投稿一覧</h1>

    <!-- 地図表示エリア -->
    <div id="map"></div>

    <!-- 投稿フォーム -->
    <form action="/posts" method="post">

        <!-- 投稿内容入力 -->
        <input type="text"
               name="content"
               placeholder="投稿を入力">

        <br><br>

        <!-- 緯度入力 -->
        <input type="text"
               name="latitude"
               placeholder="緯度">

        <br><br>

        <!-- 経度入力 -->
        <input type="text"
               name="longitude"
               placeholder="経度">

        <br><br>

        <!-- 投稿ボタン -->
        <button type="submit">
            投稿
        </button>

    </form>

    <hr>

    <!-- 投稿一覧 -->
    <ul>

        <!-- postsを1件ずつループ -->
        <li th:each="post : ${posts}">

            <!-- 投稿内容 -->
            <span th:text="${post.content}"></span>

            <br>

            <!-- 緯度 -->
            <span th:text="${post.latitude}"></span>

            <br>

            <!-- 経度 -->
            <span th:text="${post.longitude}"></span>

            <br>

            <!-- 投稿日時 -->
            <small th:text="${post.createdAt}"></small>

            <br><br>

        </li>

    </ul>

    <style>
    /* 地図サイズ */
    #map {
        height: 500px;
        width: 100%;
    }
    </style>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        // 地図生成
        const map = L.map('map');

        // 初期表示位置
        // 大阪駅付近
        map.setView([34.7025, 135.4959], 13);

        // 地図タイル追加
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {

            attribution:
                '&copy; OpenStreetMap contributors'

        }).addTo(map);

    </script>

</body>

</html>
