<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- 文字コード -->
    <meta charset="UTF-8">

    <!-- タイトル -->
    <title>Travel Map</title>

    <!-- ========================= -->
    <!-- Leaflet CSS -->
    <!-- 地図ライブラリ -->
    <!-- ========================= -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- ========================= -->
    <!-- 自作CSS -->
    <!-- ========================= -->
    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- タイトル -->
    <!-- ========================= -->
    <h1>Travel Map</h1>

    <!-- ========================= -->
    <!-- 地図表示エリア -->
    <!-- map.jsで利用 -->
    <!-- ========================= -->
    <div id="map"></div>

    <!-- ========================= -->
    <!-- 投稿フォーム -->
    <!-- ========================= -->
    <form action="/posts"
          method="post"
          th:object="${post}"
          enctype="multipart/form-data">

        <!-- ========================= -->
        <!-- 投稿内容 -->
        <!-- ========================= -->
        <div>

            <label>投稿内容</label>

            <!-- Post.content と連携 -->
            <input type="text"
                   th:field="*{content}"
                   placeholder="旅行先を入力">

            <!-- エラー表示 -->
            <div
                th:if="${#fields.hasErrors('content')}"
                th:errors="*{content}"
                style="color:red">

            </div>

        </div>

        <br>

        <!-- ========================= -->
        <!-- 画像選択 -->
        <!-- ========================= -->
        <div>

            <label>画像選択</label>

            <input type="file"
                   name="image"
                   accept="image/*">

        </div>

        <br>

        <!-- ========================= -->
        <!-- 緯度 -->
        <!-- JavaScript自動入力 -->
        <!-- ========================= -->
        <div>

            <label>緯度</label>

            <input type="text"
                   id="lat"
                   name="latitude"
                   readonly>

        </div>

        <br>

        <!-- ========================= -->
        <!-- 経度 -->
        <!-- JavaScript自動入力 -->
        <!-- ========================= -->
        <div>

            <label>経度</label>

            <input type="text"
                   id="lng"
                   name="longitude"
                   readonly>

        </div>

        <br>

        <!-- ========================= -->
        <!-- 投稿ボタン -->
        <!-- ========================= -->
        <button type="submit">

            投稿する

        </button>

    </form>

    <hr>

    <!-- ========================= -->
    <!-- 投稿一覧 -->
    <!-- ========================= -->
    <h2>投稿一覧</h2>

    <ul>

        <!-- 投稿を1件ずつ表示 -->
        <li th:each="post : ${posts}">

            <!-- 投稿内容 -->
            <b th:text="${post.content}">
            </b>

            <!-- ========================= -->
            <!-- 投稿画像 -->
            <!-- ========================= -->
            <div
                th:if="${post.imagePath != null
                        and !post.imagePath.isEmpty()}">

                <img
                    th:src="@{/uploads/{img}(img=${post.imagePath})}"
                    width="300">
            </div>

            <br>

            <!-- 緯度 -->
            緯度:
            <span th:text="${post.latitude}">
            </span>

            <br>

            <!-- 経度 -->
            経度:
            <span th:text="${post.longitude}">
            </span>

            <br>

            <!-- 投稿日時 -->
            投稿日時:
            <span th:text="${post.createdAt}">
            </span>

            <br>
            <br>

            <!-- ========================= -->
            <!-- 削除ボタン -->
            <!-- ========================= -->
            <form action="/delete"
                  method="post">

                <!-- 削除対象ID -->
                <input type="hidden"
                       name="id"
                       th:value="${post.id}">

                <button type="submit">

                    削除

                </button>

            </form>

            <hr>

        </li>

    </ul>

    <!-- ========================= -->
    <!-- Leaflet JavaScript -->
    <!-- ========================= -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- ========================= -->
    <!-- Java → JavaScript -->
    <!-- ========================= -->
    <script th:inline="javascript">

        /*
            SpringからJavaScriptへ
            投稿一覧を渡す
        */
        const posts =
            /*[[${posts}]]*/ [];

    </script>

    <!-- ========================= -->
    <!-- 自作JavaScript -->
    <!-- ========================= -->
    <script src="/js/map.js"></script>

</body>

</html>
