<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Travel Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css">

    <style>
        /* 地図サイズ */
        #map {
            height: 500px;
            width: 100%;
        }

        /* 投稿画像サイズ */
        img {
            width: 300px;
        }
    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- タイトル -->
    <!-- ========================= -->
    <h1>Travel Map</h1>

    <!-- ========================= -->
    <!-- ログインユーザー表示 -->
    <!-- ========================= -->
    <div th:if="${loginUser != null}">
        ログイン中 :
        <b th:text="${loginUser.name}"></b>

        <a href="/logout">
            ログアウト
        </a>
    </div>

    <br>

    <!-- ========================= -->
    <!-- 検索 -->
    <!-- ========================= -->
    <form action="/search" method="get">

        <input type="text"
               name="keyword"
               placeholder="検索">

        <button type="submit">
            検索
        </button>

    </form>

    <br>

    <!-- ========================= -->
    <!-- 地図 -->
    <!-- ========================= -->
    <div id="map"></div>

    <br>

    <!-- ========================= -->
    <!-- 投稿フォーム -->
    <!-- ========================= -->
    <form action="/posts"
          method="post"
          enctype="multipart/form-data"
          th:object="${post}">

        投稿内容

        <input type="text"
               th:field="*{content}">

        <br><br>

        緯度

        <input id="lat"
               type="text"
               th:field="*{latitude}"
               readonly>

        <br><br>

        経度

        <input id="lng"
               type="text"
               th:field="*{longitude}"
               readonly>

        <br><br>

        画像

        <input type="file"
               name="image">

        <br><br>

        <button type="submit">
            投稿
        </button>

    </form>

    <hr>

    <!-- ========================= -->
    <!-- 投稿一覧 -->
    <!-- ========================= -->
    <div th:each="post : ${posts}">

        <!-- 投稿内容 -->
        <h3 th:text="${post.content}"></h3>

        <!-- 投稿者 -->
        <p th:if="${post.user != null}">
            投稿者 :
            <span th:text="${post.user.name}"></span>
        </p>

        <!-- 緯度 -->
        <p>
            緯度 :
            <span th:text="${post.latitude}"></span>
        </p>

        <!-- 経度 -->
        <p>
            経度 :
            <span th:text="${post.longitude}"></span>
        </p>

        <!-- 投稿日時 -->
        <p>
            投稿日時 :
            <span th:text="${#temporals.format(post.createdAt,'yyyy/MM/dd HH:mm')}"></span>
        </p>

        <!-- 画像 -->
        <div th:if="${post.imagePath != null and !post.imagePath.isEmpty()}">

            <img th:src="@{/uploads/{file}(file=${post.imagePath})}">

        </div>

        <br>

        <div th:if="${loginUser.id == post.user.id}">

            <a th:href="@{/edit(id=${post.id})}">
                編集
            </a>

            <form action="/delete" method="post">

                <input type="hidden"
                    name="id"
                    th:value="${post.id}">

                <button type="submit">
                    削除
                </button>

            </form>

        </div>

        <hr>

    </div>

    <!-- ========================= -->
    <!-- Leaflet -->
    <!-- ========================= -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- ========================= -->
    <!-- Java → JavaScriptへデータ渡し -->
    <!-- ========================= -->
    <script th:inline="javascript">
        const posts = [];
    </script>

    <!-- ========================= -->
    <!-- map.js読み込み -->
    <!-- ========================= -->
    <script th:src="@{/js/map.js}"></script>

</body>
</html>
